<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GomiWet | คำนวณราคา</title>

    <!-- CSS -->
    <link rel="stylesheet" href="css/price.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>

<body class="container">

    <!-- 🧮 CALCULATOR -->
    <div id="calc" class="page">
        <div class="header">
            <div class="icon_frame">
                <img class="icon" src="assets/nav_icons/calculator.png" />
            </div>
            <h2>คำนวณราคา</h2>
        </div>
        <h4>เลือกประเภทเศษอาหารที่ต้องการขาย</h4>
        <div class="card_frame">
            <div class="card" onclick="selectFoodType(0)">
                <strong>ข้าว</strong>
                <img class="bigIcon" src="assets/types/rice.png" />
                <p data-price-index="0">-</p>
            </div>
            <div class="card" onclick="selectFoodType(1)">
                <strong>ผัก</strong>
                <img class="bigIcon" src="assets/types/vegetable.png" />
                <p data-price-index="1">-</p>
            </div>
            <div class="card" onclick="selectFoodType(2)">
                <strong>กระดูก</strong>
                <img class="bigIcon" src="assets/types/bone.png" />
                <p data-price-index="2">-</p>
            </div>
            <div class="card" onclick="selectFoodType(3)">
                <strong>เศษอาหารปรุงสุก</strong>
                <img class="bigIcon" src="assets/types/cooking.png" />
                <p data-price-index="3">-</p>
            </div>
            <div class="card" onclick="selectFoodType(4)">
                <strong>เนื้อสัตว์</strong>
                <img class="bigIcon" src="assets/types/meat.png" />
                <p data-price-index="4">-</p>
            </div>
            <div class="card" onclick="selectFoodType(5)">
                <strong>เศษอาหารที่ปนกัน</strong>
                <img class="bigIcon" src="assets/types/mix.png" />
                <p data-price-index="5">-</p>
            </div>
        </div>
        <div class="calcCard">
            <div>
                <strong>กรอกนํ้าหนัก:</strong>
                <input id="foodWeight" class="input_box" type="number" placeholder="น้ำหนัก (กก.)">
                <button class="primary" onclick="calculateEarnings()">คำนวณ</button>
            </div>

            <div>
                <strong>ราคาประเมิน:</strong>
                <input id="estimatedPrice" class="input_box" type="number" placeholder="ราคาประเมิน (บาท)">
            </div>
        </div>

        <h4>ตารางราคา</h4>
        <div class="table_wrapper">
            <table class="price_table">
                <!-- หัวตาราง/ชื่อคอลลัมน์-->
                <thead>
                    <tr>
                        <th>ระยะทาง (กม.)</th>
                        <th>ราคา (บาท)</th>
                    </tr>
                </thead>

                <!-- ข้อมูลในตาราง-->
                <tbody>
                    <!-- ข้อมูลแต่ละแถว -->
                    <tr>
                        <td>10</td>
                        <td>ฟรี</td>
                    </tr>
                    <tr>
                        <!-- ช่องข้อมูล -->
                        <td>20</td>
                        <td>20</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div id="bottom-nav"></div>

    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script src="js/firebase.js"></script> <!-- init firebase + db -->
    <script src="js/load-bottom-nav.js"></script>
    <script src="js/calculate.js"></script> <!-- ใช้ db -->
</body>


</html>
