<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <title>กรอกรายละเอียดการขาย</title>
  <link rel="stylesheet" href="css/sell-style.css">
</head>
<body>

  <div class="container">
    <h1>กรอกรายละเอียดการขาย</h1>

    <form id="sellForm">

      <!-- วันที่ -->
      <div class="form-group">
        <label>วันที่เข้ารับ</label>
        <input type="date" required>
      </div>

      <!-- เวลา -->
      <div class="form-group">
        <label>ช่วงเวลา</label>
        <select required>
          <option value="">-- เลือกช่วงเวลา --</option>
          <option>09:00 - 11:00</option>
          <option>11:00 - 13:00</option>
          <option>13:00 - 15:00</option>
          <option>15:00 - 17:00</option>
        </select>
      </div>

      <!-- ประเภทเศษอาหาร -->
      <div class="form-group">
        <label>ประเภทเศษอาหาร</label>
        <select required>
          <option value="">-- เลือกประเภท --</option>
          <option>เศษผัก</option>
          <option>เศษอาหารปรุงสุก</option>
          <option>กระดูก / ของเหลือจากเนื้อ</option>
          <option>อื่น ๆ</option>
        </select>
      </div>

      <!-- สถานที่ -->
      <div class="form-group">
        <label>สถานที่เข้ารับ</label>
        <textarea id="address" placeholder="กรอกที่อยู่ หรือใช้ตำแหน่งปัจจุบัน" required></textarea>
        <button type="button" id="useLocation">ใช้ตำแหน่งปัจจุบัน</button>
      </div>

      <!-- ค่าขนส่ง -->
      <div class="form-group">
        <label>ค่าขนส่ง (ประมาณ)</label>
        <input type="text" id="shippingCost" readonly>
      </div>

      <!-- หมายเหตุ -->
      <div class="form-group">
        <label>หมายเหตุเพิ่มเติม</label>
        <textarea placeholder="เช่น มีที่จอดรถ / โทรก่อนถึง"></textarea>
      </div>

      <button type="submit" class="submit-btn">ยืนยันการขาย</button>
    </form>
  </div>

  <script src="sell.js"></script>
</body>
</html>
