<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GomiWet | ค้นหาผู้รับซื้อ</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/home.css">
  <link rel="stylesheet" href="css/bottom-nav.css">

  <!-- Leaflet -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>
  <div class="page-layout">
    <!-- Header -->
    <header class="header-blue">
      <div class="header-inner">
        <img src="images/logo.jpg" class="logo" alt="logo">
        <div class="header-text">
          <h2>ค้นหาผู้รับซื้อ</h2>
          <p>ค้นหาผู้รับซื้อเศษอาหารใกล้คุณ</p>
        </div>
      </div>
    </header>

    <!-- Search -->
    <div class="search-container">
      <div class="search-box">
        <i class="fa fa-search"></i>
        <input id="searchInput" placeholder="ค้นหาร้านค้า" oninput="handleSearchInput(event)"
          oncompositionend="handleSearchInput(event)" />
      </div>
    </div>

    <!-- Map กพำำำำำำำำดไไ--->
    <div id="map" class="map-section"></div>
    <div class="dist-info" id="distDisplay">
      คำนวณระยะทางจากตำแหน่งของคุณ...
    </div>

    <!-- Store list -->
    <main class="store-section">
      <div class="section-title">ร้านแนะนำ</div>
      <div id="storeList" class="store-list"></div>
    </main>


    <div class="bottom-space"></div>
    <div id="bottom-nav"></div>

    <!-- JS -->
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

    <script src="js/firebase.js"></script>
    <script src="js/load-bottom-nav.js"></script>
  </div>
</body>
<script src="js/home.js"></script>

</html>
