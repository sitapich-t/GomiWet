<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GomiWet | คำนวณราคา</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/price.css">
  <link rel="stylesheet" href="css/bottom-nav.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">

</head>

<body class="container">

  <!-- 🧮 CALCULATOR -->
  <div id="calc" class="page">

    <!-- HEADER -->
    <div class="header">
      <div class="icon_frame">
        <img class="icon" src="assets/nav_icons/calculator.png" />
      </div>
      <h2>คำนวณราคา</h2>
    </div>

    <h4>เลือกประเภทเศษอาหารที่ต้องการขาย</h4>

    <!-- 🔥 CARD จาก Firebase -->
    <div class="card_frame">
      <!-- JS จะ generate card ใส่ตรงนี้ -->
    </div>

    <!-- 🔢 CALCULATE -->
    <div class="calcCard">
      <div>
        <strong>กรอกน้ำหนัก:</strong>
        <input id="foodWeight" class="input_box" type="number" placeholder="น้ำหนัก (กก.)" />
        <button class="primary" onclick="calculateEarnings()">
          คำนวณ
        </button>
      </div>

      <div>
        <strong>ราคาประเมิน:</strong>
        <input id="estimatedPrice" class="input_box" type="number" placeholder="ราคาประเมิน (บาท)" disabled />
      </div>
    </div>

    <!-- 📊 PRICE TABLE -->
    <div class="table-wrapper">
      <h4>ตารางราคา</h4>
      <table class="price_table">
        <thead>
          <tr>
            <th>ระยะทาง (กม.)</th>
            <th>ราคา (บาท)</th>
          </tr>
        </thead>
        <tbody>
          <tr>
            <td>10</td>
            <td>ฟรี</td>
          </tr>
          <tr>
            <td>20</td>
            <td>20</td>
          </tr>
        </tbody>
      </table>
    </div>

  </div>

  <!-- JS -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>

  <script src="js/firebase.js"></script>
  <div id="bottom-nav"></div>
  <script src="js/load-bottom-nav.js"></script>

</body>

<script src="js/price.js"></script>

</html>
