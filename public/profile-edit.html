<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>GomiWet | แก้ไขข้อมูลส่วนตัว</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/profile-edit.css">

  <!-- Font Awesome -->
  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>

  <!-- LIFF -->
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>

<body>

  <!-- HEADER -->
  <div class="header">
    <img id="userImg" class="avatar" src="https://via.placeholder.com/80">
    <h2 id="userName">กำลังโหลด...</h2>
  </div>

  <!-- CONTENT -->
  <div class="container">

    <div class="form-group">
      <label>เบอร์โทรศัพท์</label>
      <input type="tel" id="phoneInput" placeholder="เช่น 0812345678">
    </div>

    <div class="form-group">
      <label>ที่อยู่</label>
      <textarea id="addressInput" rows="3"
        placeholder="กรอกที่อยู่ของคุณ"></textarea>
    </div>

    <button id="saveBtn" class="save-btn">บันทึกข้อมูล</button>

  </div>

  <!-- JS -->
  <script src="js/firebase.js"></script>
  <script src="js/profile-edit.js"></script>

</body>
</html>
