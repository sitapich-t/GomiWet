<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>โปรไฟล์ | GomiWet</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>

  <div class="profile-header">
    <div class="user-info">
      <div class="avatar-container">
        <img id="userImg" src="https://via.placeholder.com/80" alt="Profile">
        <button class="edit-btn" onclick="location.href='profile-edit.html'"><i class="fa-solid fa-pen-to-square"></i></button>
      </div>
      <div class="user-detail">
        <h2 id="userName">กำลังโหลด...</h2>
        <p><i class="fa-solid fa-phone"></i> <span id="userPhone">-</span></p>
        <p><i class="fa-solid fa-location-dot"></i> <span id="userAddress">-</span></p>
      </div>
    </div>
  </div>

  <main class="container">
    <div class="summary-grid">
      <div class="sum-card">
        <div class="sum-title">ยอดการขายทั้งหมด <i class="fa-solid fa-box-open"></i></div>
        <div class="sum-value" id="totalSales">0</div>
      </div>
      <div class="sum-card">
        <div class="sum-title">รายได้ทั้งหมด <i class="fa-solid fa-comment-dollar"></i></div>
        <div class="sum-value">฿<span id="totalIncome">0</span></div>
      </div>
    </div>

    <div class="history-section">
      <div class="section-header">
        <h3>ประวัติการขาย</h3>
        <span class="count-badge" id="historyCount">0 รายการ</span>
      </div>

      <div id="historyList">
        <p class="loading-text">กำลังโหลดประวัติ...</p>
      </div>

      <button class="view-all-btn">แสดงรายการทั้งหมด ></button>
    </div>
  </main>

  <div id="bottom-nav"></div>
  <script src="js/load-bottom-nav.js"></script>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
  <script src="js/firebase.js"></script>
  <script src="js/profile.js"></script>
</body>

</html>
