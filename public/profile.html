<!DOCTYPE html>
<html lang="th">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GomiWet | โปรไฟล์</title>

  <!-- CSS -->
  <link rel="stylesheet" href="css/profile.css">
  <link rel="stylesheet" href="css/bottom-nav.css">

  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body class="container">

  <!-- HEADER -->
  <div class="profile-header">
    <div class="profile-top">

      <div class="avatar-container">
        <img id="userImg" src="https://via.placeholder.com/80" alt="avatar">
      </div>

      <div class="profile-info">
        <div class="name-row">
          <h2 id="userName">กำลังโหลด...</h2>
          <button class="edit-btn" onclick="location.href='profile-edit.html'">
            <i class="fa-solid fa-pen"></i>
          </button>
        </div>

        <p class="info-row"><i class="fa-solid fa-phone"></i> <span id="userPhone">-</span></p>
        <p class="info-row"><i class="fa-solid fa-location-dot"></i> <span id="userAddress">-</span></p>
      </div>

    </div>
  </div>


  <!-- CONTENT -->
  <main class="container">

    <!-- SUMMARY -->
    <div class="summary-grid">
      <div class="summary-card">
        <div class="summary-title">
          ยอดการขายทั้งหมด <i class="fa-solid fa-box"></i>
        </div>
        <div class="summary-value" id="totalSales">0</div>
      </div>

      <div class="summary-card">
        <div class="summary-title">
          รายได้ทั้งหมด <i class="fa-solid fa-dollar-sign"></i>
        </div>
        <div class="summary-value">฿<span id="totalIncome">0</span></div>
      </div>
    </div>

    <!-- HISTORY -->
    <div class="history-section">
      <div class="history-header">
        <h3>ประวัติการขาย</h3>
        <span class="badge" id="historyCount"></span>
      </div>

      <div id="historyList"></div>

      <button onclick="openAllOrders()" class="view-all-btn">
        แสดงรายการทั้งหมด
      </button>
    </div>


    <div class="bottom-space"></div>

  </main>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <div id="bottom-nav"></div>
  <script src="js/load-bottom-nav.js"></script>
  <script src="js/firebase.js"></script>
</body>

<script src="js/profile.js"></script>

</html>
