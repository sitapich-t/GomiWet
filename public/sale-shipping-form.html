<!DOCTYPE html>
<html lang="th">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>กรอกข้อมูลการขายต้องการขนส่ง | GomiWet</title>
    <link rel="stylesheet" href="css/sale-form.css">
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body>

    <div class="container">

        <div class="card">
            <h3>วัน-เวลาที่เข้ารับสินค้า</h3>
          
            <div class="datetime-group">
              <div class="input-box">
                <label>วันที่</label>
                <input type="date" id="date">
              </div>
          
              <div class="input-box">
                <label>เวลา</label>
                <input type="time" id="time">
              </div>
            </div>
        </div>
          
        <div class="card">
            <label>ที่อยู่รับสินค้า</label>
          
            <!-- ช่องแสดงผลจาก GPS (ไม่ให้พิมพ์เอง ลดพัง) -->
            <input
              type="text"
              id="address"
              placeholder="กรุณากดปุ่มเพื่อใช้ตำแหน่งปัจจุบัน"
              readonly
            >
          
            <!-- ปุ่ม GPS ทำให้ใหญ่/เด่น -->
            <button
              type="button"
              onclick="getCurrentLocation()"
              style="width:100%; padding:12px; font-size:16px;"
            >
              📍 ใช้ตำแหน่งปัจจุบัน
            </button>
          
            <!-- รายละเอียดเพิ่มเติมให้ผู้ใช้พิมพ์เอง -->
            <input
              type="text"
              id="addressDetail"
              placeholder="บ้านเลขที่ หมู่ ซอย เพิ่มเติม (ถ้ามี)"
            >
          
            <p id="shippingText" style="margin-top:8px; font-weight:bold;"></p>

            <p style="font-size:13px; color:#666; margin-top:6px;">
                กรุณากดปุ่มด้านบนเพื่อให้ระบบคำนวณค่าขนส่งอัตโนมัติ
            </p>
            
        </div>                  

        <div class="card">
            <h3>ประเภทเศษอาหาร / น้ำหนัก (กก.)</h3>
            <p style="color:#888;font-size:14px">
                * สามารถกรอกได้ครั้งละ 1 ประเภทเท่านั้น
            </p>
            <div id="wasteList"></div>
        </div>

        <div class="card">
            <label>หมายเหตุ</label>
            <textarea id="note" placeholder="รายละเอียดเพิ่มเติม..."></textarea>
        </div>

        <button type="button" id="submitBtn" class="submit-btn" onclick="submitSale()">
          ยืนยันการขาย
        </button>

    </div>
  
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

    <script src="js/firebase.js"></script>
    <script src="js/sale-shipping-form.js"></script>
</body>

</html>
