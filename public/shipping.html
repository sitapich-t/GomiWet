<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>บริการขนส่ง</title>
  <link rel="stylesheet" href="shipping.css">
</head>
<body>

  <header class="header">
    <h2>กรอกข้อมูลการขาย</h2>
    <p>เลือกช่องทางขนส่งและกรอกข้อมูลที่จำเป็น</p>
  </header>

  <div class="card">
    <h3>บริการขนส่ง</h3>

    <button class="btn primary" onclick="goShipping()">
      ต้องการขนส่ง
    </button>

    <button class="btn outline" onclick="goNoShipping()">
      ไม่ต้องการขนส่ง
    </button>
  </div>

  <script src="shipping.js"></script>
</body>
</html>
